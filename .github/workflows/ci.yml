name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only access to the repository. CI never needs secrets or write access.
permissions:
  contents: read

jobs:
  check:
    name: Build, check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The latest 1.27 patch release, so CI picks up Go security fixes
          # without waiting for go.mod to change. Update this and go.mod when
          # moving to a new Go minor version.
          go-version: "1.27.x"
          check-latest: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go tool staticcheck ./...

      - name: Test
        run: go test -race ./...

      - name: Scan for known vulnerabilities
        run: go tool govulncheck ./...

      - name: Build
        run: go build ./...
